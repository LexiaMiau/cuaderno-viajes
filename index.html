<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cuaderno de viaje</title>

<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css" />
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

<style>
  :root{
    --ink:#1C2321; --paper:#f5f4f0; --card:#FFFFFF;
    --moss:#3F5D45; --moss-dark:#2C4330; --clay:#B5652D;
    --line:#E4E0D4; --muted:#767267;
  }
  body{ background:var(--paper); color:var(--ink); font-family:'Inter',sans-serif; }
  .font-display{ font-family:'Playfair Display',serif; }
  .leaflet-container{ font-family:'Inter',sans-serif; }

  [contenteditable]:focus{ outline:none; background:rgba(63,93,69,0.05); border-radius:4px; }
  [contenteditable][data-placeholder]:empty:before{ content: attr(data-placeholder); color:var(--muted); }
  [contenteditable]:hover{ background:rgba(0,0,0,0.03); border-radius:4px; }
  .editable-hint{ border-bottom:1px dashed var(--line); cursor:pointer; }
  .editable-hint:hover{ border-color:var(--muted); }
  .tag-remove-btn{ opacity:0.6; }
  .tag-remove-btn:hover{ opacity:1; }

  .block{ position:relative; }
  .drop-before{ box-shadow: inset 0 2px 0 0 var(--moss); }
  .drop-after{ box-shadow: inset 0 -2px 0 0 var(--moss); }

  .day-rail{ background:#D8D4C6; width:1px; }
  .day-dot{ background:var(--card); border:2px solid var(--moss); color:var(--moss); font-family:'Playfair Display',serif; }

  .icon-btn{ color:var(--muted); }
  .icon-btn:hover{ color:var(--ink); }

  .stat-value{ font-variant-numeric: tabular-nums; }

  .dropzone{ transition: border-color .15s ease, background-color .15s ease; }
  .dropzone.dragover{ border-color: var(--moss); background-color: rgba(63,93,69,0.06); }

  .btn-primary{ background:var(--moss); color:#fff; }
  .btn-primary:hover{ background:var(--moss-dark); }
  .btn-ghost{ border:1px solid var(--line); color:var(--ink); }
  .btn-ghost:hover{ background:rgba(0,0,0,0.03); }

  .toggle-chevron{ transition: transform .15s ease; }
  .toggle-chevron.open{ transform: rotate(90deg); }

  .card-hover{ transition: box-shadow .15s ease, transform .15s ease; }
  .card-hover:hover{ box-shadow: 0 10px 28px rgba(28,35,33,0.10); transform: translateY(-2px); }

  .is-hidden{ display:none !important; }

  ::-webkit-scrollbar{ width:8px; height:8px; }
  ::-webkit-scrollbar-thumb{ background:var(--line); border-radius:4px; }
</style>
</head>
<body class="min-h-screen">

<!-- ==================================================================
     VISTA 1 — DASHBOARD ("Workspace")
     ================================================================== -->
<div id="dashboardView">
  <div class="max-w-5xl mx-auto px-6 py-14">
    <div class="flex items-center justify-between mb-10">
      <h1 class="font-display text-3xl">Mis viajes</h1>
      <button id="newTripBtn" class="btn-primary rounded-full px-5 py-2.5 text-sm font-medium">+ Nuevo viaje</button>
    </div>

    <section id="upcomingSection" class="mb-12">
      <h2 class="text-sm font-medium tracking-wide mb-4" style="color:var(--muted);">Próximos viajes</h2>
      <div id="upcomingGrid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6"></div>
    </section>

    <section id="pastSection">
      <h2 class="text-sm font-medium tracking-wide mb-4" style="color:var(--muted);">Viajes pasados</h2>
      <div id="pastGrid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6"></div>
    </section>
  </div>
</div>

<!-- ==================================================================
     VISTA 2 — EDITOR DE VIAJE
     ================================================================== -->
<div id="editorView" class="is-hidden">
  <div class="max-w-2xl mx-auto px-6 py-10">

    <button id="backToDashboardBtn" class="flex items-center gap-1.5 text-sm mb-8 icon-btn">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 18l-6-6 6-6"/></svg>
      Volver a mis viajes
    </button>

    <header class="mb-12">
      <h1 id="editorTitle" contenteditable="true" data-placeholder="Título del viaje" class="font-display text-4xl leading-tight mb-3"></h1>
      <div class="flex flex-wrap items-center gap-2 text-sm" style="color:var(--muted);">
        <div id="editorDates"></div>
        <div id="editorTags" class="flex flex-wrap items-center gap-1.5"></div>
      </div>
    </header>

    <div id="timeline"></div>

    <button id="addDayBtn" class="mt-6 text-sm btn-ghost rounded-full px-4 py-2 font-medium">+ Añadir día</button>
  </div>
</div>

<!-- ==================================================================
     MODAL — Nuevo viaje
     ================================================================== -->
<div id="newTripModal" class="is-hidden fixed inset-0 z-[1000] flex items-center justify-center p-6">
  <div id="newTripModalBackdrop" class="absolute inset-0 bg-black/40"></div>
  <div class="relative bg-white rounded-2xl max-w-md w-full p-6" style="box-shadow:0 20px 50px rgba(28,35,33,0.18);">
    <p class="font-display text-2xl mb-6">Nuevo viaje</p>

    <label class="block text-xs mb-1.5" style="color:var(--muted);">Nombre del viaje</label>
    <input id="newTripName" type="text" placeholder="Ej. Ruta por la Toscana"
      class="w-full rounded-lg px-3 py-2 text-sm mb-4" style="border:1px solid var(--line);" />

    <div class="grid grid-cols-2 gap-3 mb-4">
      <div>
        <label class="block text-xs mb-1.5" style="color:var(--muted);">Fecha de inicio</label>
        <input id="newTripStart" type="date" class="w-full rounded-lg px-3 py-2 text-sm" style="border:1px solid var(--line);" />
      </div>
      <div>
        <label class="block text-xs mb-1.5" style="color:var(--muted);">Fecha de fin</label>
        <input id="newTripEnd" type="date" class="w-full rounded-lg px-3 py-2 text-sm" style="border:1px solid var(--line);" />
      </div>
    </div>

    <label class="block text-xs mb-1.5" style="color:var(--muted);">Destinos principales</label>
    <input id="newTripTagInput" type="text" placeholder="Escribe un destino y pulsa Enter"
      class="w-full rounded-lg px-3 py-2 text-sm mb-2" style="border:1px solid var(--line);" />
    <div id="newTripTagChips" class="flex flex-wrap gap-1.5 mb-6 min-h-[1.5rem]"></div>

    <div class="flex justify-end gap-2">
      <button id="cancelTripBtn" class="btn-ghost rounded-full px-4 py-2 text-sm font-medium">Cancelar</button>
      <button id="createTripBtn" class="btn-primary rounded-full px-4 py-2 text-sm font-medium">Crear viaje</button>
    </div>
  </div>
</div>

<!-- ==================================================================
     MENÚ SLASH (popover compartido, se reposiciona dinámicamente)
     ================================================================== -->
<div id="slashMenu" class="is-hidden fixed z-[900] bg-white rounded-xl py-1.5 w-56" style="border:1px solid var(--line); box-shadow:0 10px 28px rgba(28,35,33,0.14);"></div>

<!-- Panel de puntos GPX (compartido por todos los bloques de ruta) -->
<div id="pointsPanel" class="is-hidden fixed inset-0 z-[1000] bg-black/40 flex items-center justify-center p-6">
  <div class="bg-white rounded-2xl max-w-md w-full max-h-[70vh] flex flex-col overflow-hidden">
    <div class="p-4 flex items-center justify-between" style="border-bottom:1px solid var(--line);">
      <p class="font-display text-lg">Puntos de la ruta</p>
      <button id="closePointsBtn" class="w-7 h-7 rounded-full btn-ghost flex items-center justify-center text-sm">✕</button>
    </div>
    <div id="pointsList" class="overflow-y-auto p-4 text-xs font-mono space-y-1"></div>
  </div>
</div>

<script>
/* ================================================================
   ICONOS
   ================================================================ */
const ICONS = {
  close: `<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 6l12 12M18 6L6 18"/></svg>`,
  chevron: `<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 6l6 6-6 6"/></svg>`,
  pin: `<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 22s7-7.58 7-12.5A7 7 0 0 0 5 9.5C5 14.42 12 22 12 22Z"/><circle cx="12" cy="9.5" r="2.3"/></svg>`,
  dots: `<svg width="10" height="16" viewBox="0 0 10 16" fill="currentColor"><circle cx="2" cy="2" r="1.4"/><circle cx="8" cy="2" r="1.4"/><circle cx="2" cy="8" r="1.4"/><circle cx="8" cy="8" r="1.4"/><circle cx="2" cy="14" r="1.4"/><circle cx="8" cy="14" r="1.4"/></svg>`,
  bed: `<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3 18v-7a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2M3 18v3M3 13h18M13 11h5a3 3 0 0 1 3 3v4M21 18v3"/></svg>`,
  plane: `<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M22 2L11 13M22 2l-7 20-4-9-9-4 20-7z"/></svg>`,
  route: `<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3 20l5.5-14 4 8 2.5-5L20 20"/></svg>`,
  cloud: `<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M17 18a4 4 0 0 0 0-8 5.2 5.2 0 0 0-9.9-1.7A4.3 4.3 0 0 0 6 18h11z"/></svg>`,
  text: `<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 6h16M4 12h16M4 18h10"/></svg>`,
};

let uidCounter = 0;
const uid = (prefix) => `${prefix}-${Date.now()}-${uidCounter++}`;

/* ================================================================
   MÓDULO GPX (parser + mapa + perfil de elevación)
   Aislado con try/catch para que un fallo de red/librería nunca
   rompa el resto de la app — solo se omite el mapa si no carga.
   ================================================================ */
function haversineKm(lat1, lon1, lat2, lon2) {
  const R = 6371;
  const toRad = (d) => (d * Math.PI) / 180;
  const dLat = toRad(lat2 - lat1), dLon = toRad(lon2 - lon1);
  const a = Math.sin(dLat/2)**2 + Math.cos(toRad(lat1))*Math.cos(toRad(lat2))*Math.sin(dLon/2)**2;
  return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
}
function estimateDurationMinutes(distanceKm, gainM) { return (distanceKm/4)*60 + (gainM/600)*60; }
function formatMinutes(total) {
  const h = Math.floor(total/60), m = Math.round(total%60);
  return h === 0 ? `${m} min` : `${h}h ${m.toString().padStart(2,"0")}min`;
}
function parseGPX(xmlText) {
  const xml = new DOMParser().parseFromString(xmlText, "text/xml");
  if (xml.querySelector("parsererror")) throw new Error("El archivo no es un XML válido.");
  let nodes = Array.from(xml.getElementsByTagName("trkpt"));
  if (nodes.length === 0) nodes = Array.from(xml.getElementsByTagName("rtept"));
  if (nodes.length === 0) throw new Error("No se han encontrado puntos de track (<trkpt>).");
  const nameNode = xml.querySelector("trk > name") || xml.querySelector("metadata > name");
  const name = nameNode ? nameNode.textContent.trim() : "Ruta sin nombre";
  const points = nodes.map((node) => {
    const eleNode = node.getElementsByTagName("ele")[0];
    const timeNode = node.getElementsByTagName("time")[0];
    return {
      lat: parseFloat(node.getAttribute("lat")), lon: parseFloat(node.getAttribute("lon")),
      ele: eleNode ? parseFloat(eleNode.textContent) : null,
      time: timeNode ? new Date(timeNode.textContent) : null,
    };
  });
  let distanceKm = 0, gain = 0, loss = 0;
  for (let i = 0; i < points.length; i++) {
    const p = points[i];
    if (i > 0) {
      const prev = points[i-1];
      distanceKm += haversineKm(prev.lat, prev.lon, p.lat, p.lon);
      if (prev.ele !== null && p.ele !== null) {
        const diff = p.ele - prev.ele;
        if (diff > 0.5) gain += diff; else if (diff < -0.5) loss += Math.abs(diff);
      }
    }
  }
  let durationLabel;
  const first = points[0].time, last = points[points.length-1].time;
  if (first && last && last > first) durationLabel = formatMinutes((last-first)/60000) + " (real)";
  else durationLabel = formatMinutes(estimateDurationMinutes(distanceKm, gain)) + " (est.)";
  return { name, points, distanceKm, gain, loss, durationLabel };
}

function renderGPXVisuals(block, route) {
  const latlngs = route.points.map((p) => [p.lat, p.lon]);
  const mapEl = document.getElementById(`map-${block.id}`);
  try {
    if (typeof L === "undefined") throw new Error("Leaflet no está disponible");
    const map = L.map(mapEl, { zoomControl: false, attributionControl: true });
    L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", { maxZoom: 19, attribution: "&copy; OpenStreetMap" }).addTo(map);
    L.control.zoom({ position: "bottomright" }).addTo(map);
    const line = L.polyline(latlngs, { color: "#3F5D45", weight: 4, opacity: 0.9 }).addTo(map);
    L.circleMarker(latlngs[0], { radius: 6, color: "#3F5D45", fillColor: "#3F5D45", fillOpacity: 1 }).addTo(map).bindTooltip("Inicio");
    L.circleMarker(latlngs[latlngs.length-1], { radius: 6, color: "#B5652D", fillColor: "#B5652D", fillOpacity: 1 }).addTo(map).bindTooltip("Fin");
    map.fitBounds(line.getBounds(), { padding: [24,24] });
    setTimeout(() => map.invalidateSize(), 60);
  } catch (err) {
    if (mapEl) mapEl.innerHTML = `<div class="w-full h-full flex items-center justify-center text-xs text-center px-4" style="color:var(--muted);">Mapa no disponible ahora mismo. Los datos de la ruta se han calculado igualmente.</div>`;
    console.warn("No se pudo montar el mapa:", err.message);
  }
  try {
    const svg = document.getElementById(`elev-${block.id}`);
    const w = 600, h = 60, pad = 4;
    const elevations = route.points.map((p) => p.ele).filter((e) => e !== null);
    if (svg && elevations.length >= 2 && route.distanceKm > 0) {
      const min = Math.min(...elevations), max = Math.max(...elevations), range = (max-min) || 1;
      let cumulative = 0;
      const coords = route.points.map((p, i) => {
        if (i > 0) cumulative += haversineKm(route.points[i-1].lat, route.points[i-1].lon, p.lat, p.lon);
        const x = (cumulative/route.distanceKm)*(w-pad*2)+pad;
        const y = h-pad-((p.ele-min)/range)*(h-pad*2);
        return [x,y];
      });
      const linePath = "M" + coords.map(([x,y]) => `${x.toFixed(1)},${y.toFixed(1)}`).join(" L");
      const areaPath = linePath + ` L${w-pad},${h} L${pad},${h} Z`;
      svg.innerHTML = `<path d="${areaPath}" fill="rgba(63,93,69,0.08)"/><path d="${linePath}" fill="none" stroke="#3F5D45" stroke-width="1.5"/>`;
    }
  } catch (err) { console.warn("No se pudo dibujar el perfil de elevación:", err.message); }
}

/* ================================================================
   MODELO DE DATOS
   ================================================================ */
function newTextBlock(content = "") { return { id: uid("blk"), type: "text", content }; }
function newGPXBlock(gpxText = null) { return { id: uid("blk"), type: "gpx", gpxText, route: null }; }
function newAccommodationBlock(data = {}) {
  return { id: uid("blk"), type: "accommodation", name: data.name || "", checkIn: data.checkIn || "", checkOut: data.checkOut || "", address: data.address || "" };
}
function newFlightBlock(data = {}) {
  return { id: uid("blk"), type: "flight", airline: data.airline || "", flightNumber: data.flightNumber || "",
    from: data.from || "", to: data.to || "", departure: data.departure || "", arrival: data.arrival || "" };
}
function newPlanBBlock(data = {}) {
  return { id: uid("blk"), type: "planb", title: data.title || "Plan B / Clima", content: data.content || "", open: false };
}
function newDay(label, date) { return { id: uid("day"), label, date, blocks: [] }; }

function formatDateRange(start, end) {
  if (!start && !end) return "Fechas por definir";
  const opts = { day: "numeric", month: "short" };
  const s = start ? new Date(start + "T00:00:00").toLocaleDateString("es-ES", opts) : "";
  const e = end ? new Date(end + "T00:00:00").toLocaleDateString("es-ES", { day: "numeric", month: "short", year: "numeric" }) : "";
  return s && e ? `${s} – ${e}` : (s || e);
}
function newTrip({ title, startDate, endDate, destinations }) {
  const status = tripStatus(endDate);
  return {
    id: uid("trip"), title, startDate, endDate, destinations: destinations || [],
    dates: formatDateRange(startDate, endDate), status, days: [newDay("Día 1", "")],
  };
}
const REFERENCE_TODAY = new Date("2026-09-10");
function tripStatus(endDate) {
  return endDate && new Date(endDate) < REFERENCE_TODAY ? "past" : "upcoming";
}

/* ================================================================
   COMPONENTES REUTILIZABLES — fechas y etiquetas editables al clic
   Se usan tanto en las tarjetas del Dashboard como en el editor,
   así solo hay una implementación que mantener y probar.
   ================================================================ */
function renderEditableDates(container, trip, onCommit) {
  container.innerHTML = `<span class="dates-display editable-hint" title="Editar fechas">${trip.dates}</span>`;
  container.querySelector(".dates-display").addEventListener("click", (e) => {
    e.stopPropagation();
    container.innerHTML = `
      <input type="date" class="date-start-input text-xs rounded px-1.5 py-1" style="border:1px solid var(--line); color:var(--ink);" value="${trip.startDate || ""}">
      <span>–</span>
      <input type="date" class="date-end-input text-xs rounded px-1.5 py-1" style="border:1px solid var(--line); color:var(--ink);" value="${trip.endDate || ""}">
    `;
    const startInput = container.querySelector(".date-start-input");
    const endInput = container.querySelector(".date-end-input");
    [startInput, endInput].forEach((inp) => inp.addEventListener("click", (ev) => ev.stopPropagation()));
    const commit = () => {
      trip.startDate = startInput.value;
      trip.endDate = endInput.value;
      trip.dates = formatDateRange(trip.startDate, trip.endDate);
      trip.status = tripStatus(trip.endDate);
      renderEditableDates(container, trip, onCommit);
      if (onCommit) onCommit();
    };
    startInput.addEventListener("change", commit);
    endInput.addEventListener("change", commit);
    startInput.focus();
  });
}

function renderEditableTags(container, trip, onChange) {
  container.innerHTML = trip.destinations.map((d, i) =>
    `<span class="inline-flex items-center gap-1 rounded-full px-2.5 py-1 text-xs" style="background:rgba(63,93,69,0.08); color:var(--moss-dark);">${d}<button data-i="${i}" class="tag-remove-btn" title="Quitar destino">${ICONS.close}</button></span>`
  ).join("") + `<input type="text" class="tag-add-input text-xs rounded-full px-2.5 py-1 outline-none" placeholder="+ destino" style="border:1px dashed var(--line); width:84px; background:transparent; color:var(--ink);">`;

  // Evita que un clic en el espacio vacío del contenedor de etiquetas
  // burbujee hasta la tarjeta y navegue al editor por error.
  container.onclick = (e) => e.stopPropagation();

  container.querySelectorAll(".tag-remove-btn").forEach((btn) => {
    btn.addEventListener("click", (e) => {
      e.stopPropagation();
      trip.destinations.splice(parseInt(btn.dataset.i), 1);
      renderEditableTags(container, trip, onChange);
      if (onChange) onChange();
    });
  });

  const addInput = container.querySelector(".tag-add-input");
  addInput.addEventListener("click", (e) => e.stopPropagation());
  addInput.addEventListener("keydown", (e) => {
    if (e.key === "Enter" || e.key === ",") {
      e.preventDefault();
      const val = addInput.value.trim().replace(/,$/, "");
      if (val) {
        trip.destinations.push(val);
        renderEditableTags(container, trip, onChange);
        if (onChange) onChange();
        const newInput = container.querySelector(".tag-add-input");
        if (newInput) newInput.focus();
      }
    }
  });
}

/* ================================================================
   DATOS MOCKEADOS
   ================================================================ */
const GPX_MONTREBEI = `<?xml version="1.0" encoding="UTF-8"?>

const GPX_VALLDARAN = `<?xml version="1.0" encoding="UTF-8"?>
<gpx version="1.1" creator="ejemplo" xmlns="http://www.topografix.com/GPX/1/1">
<metadata><name>Pujada al Pic de Salardú</name></metadata>
<trk><name>Pujada al Pic de Salardú</name><trkseg>
<trkpt lat="42.6890" lon="0.8460"><ele>1270</ele><time>2026-10-13T07:30:00Z</time></trkpt>
<trkpt lat="42.6995" lon="0.8590"><ele>1560</ele><time>2026-10-13T08:10:00Z</time></trkpt>

/* ----- Metadatos editables de la ruta -----
   Nombre, distancia, desnivel y duración viven en block.meta como texto libre,
   igual que los campos del vuelo. Si se sube un .gpx se rellenan solos,
   pero siempre se pueden corregir o escribir a mano. */
const EMPTY_META = () => ({ name: "", distance: "", gain: "", loss: "", duration: "" });

function metaFromRoute(route) {
  return {
    name: route.name || "",
    distance: route.distanceKm.toFixed(1) + " km",
    gain: route.gain ? "+" + Math.round(route.gain) + " m" : "",
    loss: route.loss ? "−" + Math.round(route.loss) + " m" : "",
    duration: route.durationLabel || "",
  };
}

// Adjunta un .gpx al bloque. Solo rellena los campos que estén vacíos,
// así nunca se pisa lo que la usuaria ya haya escrito a mano.
function attachGPXToBlock(block, route) {
  block.route = route;
  const fresh = metaFromRoute(route);
  if (!block.meta) block.meta = fresh;
  else Object.keys(fresh).forEach((k) => { if (!block.meta[k]) block.meta[k] = fresh[k]; });
}

function readGPXFileInto(file, block, container, errorEl) {
  const reader = new FileReader();
  reader.onload = (ev) => {
    try {
      attachGPXToBlock(block, parseGPX(ev.target.result));
      mountGPXBlock(container, block);
    } catch (err) {
      errorEl.textContent = err.message;
      errorEl.classList.remove("is-hidden");
    }
  };
  reader.readAsText(file);
}

function mountGPXBlock(container, block) {
  // Bloque precargado con texto GPX crudo: se parsea una sola vez
  if (!block.route && block.gpxText) {
    try { attachGPXToBlock(block, parseGPX(block.gpxText)); }
    catch (err) { container.innerHTML = `<p class="text-sm" style="color:var(--clay);">${err.message}</p>`; return; }
  }

  // ---------- Estado vacío: subir .gpx o rellenar a mano ----------
  if (!block.route && !block.manual) {
    container.innerHTML = `
      <div class="dropzone rounded-xl border-2 border-dashed p-6 text-center" style="border-color:var(--line);">
        <p class="text-sm mb-3" style="color:var(--muted);">Añade el .gpx de esta etapa (Wikiloc) o rellénala a mano</p>
        <div class="flex items-center justify-center gap-2 flex-wrap">
          <label class="btn-primary inline-block rounded-full px-4 py-2 text-sm font-medium cursor-pointer">
            Seleccionar archivo .gpx
            <input type="file" accept=".gpx" class="is-hidden gpx-file-input" />
          </label>
          <button type="button" class="manual-btn btn-ghost rounded-full px-4 py-2 text-sm font-medium">Rellenar a mano</button>
        </div>
        <p class="gpx-error text-xs mt-3 is-hidden" style="color:var(--clay);"></p>
      </div>`;
    const dropzone = container.querySelector(".dropzone"), input = container.querySelector(".gpx-file-input"), errorEl = container.querySelector(".gpx-error");
    input.addEventListener("change", (e) => { const f = e.target.files[0]; if (f) readGPXFileInto(f, block, container, errorEl); });
    ["dragover","dragleave","drop"].forEach((evt) => dropzone.addEventListener(evt, (e) => { e.preventDefault(); dropzone.classList.toggle("dragover", evt === "dragover"); }));
    dropzone.addEventListener("drop", (e) => { const f = e.dataTransfer.files[0]; if (f) readGPXFileInto(f, block, container, errorEl); });
    container.querySelector(".manual-btn").addEventListener("click", () => {
      block.manual = true;
      if (!block.meta) block.meta = EMPTY_META();
      mountGPXBlock(container, block);
    });
    return;
  }

  // ---------- Tarjeta de ruta (con o sin archivo .gpx) ----------
  if (!block.meta) block.meta = EMPTY_META();
  const hasRoute = !!block.route;
  container.innerHTML = `
    <div class="rounded-xl overflow-hidden" style="border:1px solid var(--line); background:var(--card);">
      ${hasRoute ? `
        <div id="map-${block.id}" style="height:220px; background:#e9e6db;"></div>
        <svg id="elev-${block.id}" viewBox="0 0 600 60" preserveAspectRatio="none" style="height:48px; width:100%; display:block;"></svg>
      ` : ""}
      <div class="p-4">
        <p class="gpx-name single-line font-display text-base mb-3" contenteditable="true" data-placeholder="Nombre de la ruta"></p>
        <div class="grid grid-cols-4 gap-2 mb-4">
          <div><p class="gpx-distance single-line stat-value font-display text-lg leading-none" contenteditable="true" data-placeholder="0 km"></p><p class="text-xs mt-1" style="color:var(--muted);">distancia</p></div>
          <div><p class="gpx-gain single-line stat-value font-display text-lg leading-none" contenteditable="true" data-placeholder="+0 m" style="color:var(--moss);"></p><p class="text-xs mt-1" style="color:var(--muted);">desnivel +</p></div>
          <div><p class="gpx-loss single-line stat-value font-display text-lg leading-none" contenteditable="true" data-placeholder="−0 m" style="color:var(--clay);"></p><p class="text-xs mt-1" style="color:var(--muted);">desnivel −</p></div>
          <div><p class="gpx-duration single-line stat-value font-display text-lg leading-none" contenteditable="true" data-placeholder="0h 00min"></p><p class="text-xs mt-1" style="color:var(--muted);">duración</p></div>
        </div>
        <div class="flex gap-2">
          ${hasRoute ? `
            <button class="view-points-btn btn-ghost rounded-full px-3 py-1.5 text-xs font-medium flex-1">Ver puntos</button>
            <button class="download-points-btn btn-primary rounded-full px-3 py-1.5 text-xs font-medium flex-1">Descargar JSON</button>
          ` : `
            <label class="btn-ghost rounded-full px-3 py-1.5 text-xs font-medium flex-1 text-center cursor-pointer">
              Añadir .gpx para ver el mapa
              <input type="file" accept=".gpx" class="is-hidden gpx-file-input" />
            </label>
          `}
        </div>
        <p class="gpx-error text-xs mt-3 is-hidden" style="color:var(--clay);"></p>
      </div>
    </div>`;

  // Cada campo escribe directamente en block.meta (mismo patrón que el bloque de vuelo)
  const fieldMap = { ".gpx-name": "name", ".gpx-distance": "distance", ".gpx-gain": "gain", ".gpx-loss": "loss", ".gpx-duration": "duration" };
  Object.entries(fieldMap).forEach(([sel, key]) => {
    const el = container.querySelector(sel);
    el.textContent = block.meta[key];
    el.addEventListener("input", () => { block.meta[key] = el.textContent; });
  });

  if (hasRoute) {
    renderGPXVisuals(block, block.route);
    container.querySelector(".view-points-btn").addEventListener("click", () => openPointsPanel(block.route));
    container.querySelector(".download-points-btn").addEventListener("click", () => downloadPoints(block.route, block.meta.name));
  } else {
    const input = container.querySelector(".gpx-file-input");
    const errorEl = container.querySelector(".gpx-error");
    input.addEventListener("change", (e) => { const f = e.target.files[0]; if (f) readGPXFileInto(f, block, container, errorEl); });
  }
}

function openPointsPanel(route) {
  document.getElementById("pointsList").innerHTML = route.points.map((p,i) => `<div>${i+1}. lat ${p.lat.toFixed(5)}, lon ${p.lon.toFixed(5)}${p.ele!==null?`, ele ${p.ele.toFixed(0)}m`:""}</div>`).join("");
  document.getElementById("pointsPanel").classList.remove("is-hidden");
}
function downloadPoints(route, customName) {
  const blob = new Blob([JSON.stringify(route.points, null, 2)], { type: "application/json" });
  const url = URL.createObjectURL(blob);
  const baseName = ((customName || route.name || "ruta").trim() || "ruta").replace(/\s+/g, "_");
  const a = document.createElement("a"); a.href = url; a.download = `${baseName}_puntos.json`; a.click();
  URL.revokeObjectURL(url);
}

const BLOCK_RENDERERS = { text: renderTextBlock, gpx: renderGPXBlock, accommodation: renderAccommodationBlock, flight: renderFlightBlock, planb: renderPlanBBlock };

/* ================================================================
   DRAG & DROP — reordenar bloques dentro de un día
   ================================================================ */
let draggedBlockId = null;

function attachDragEvents(container, day) {
  container.addEventListener("dragstart", (e) => {
    const blockEl = e.target.closest(".block");
    if (!blockEl || blockEl.draggable !== true) return;
    draggedBlockId = blockEl.dataset.blockId;
    e.dataTransfer.effectAllowed = "move";
    try { e.dataTransfer.setData("text/plain", draggedBlockId); } catch (err) {}
    setTimeout(() => blockEl.classList.add("opacity-40"), 0);
  });
  container.addEventListener("dragend", (e) => {
    const blockEl = e.target.closest(".block");
    if (blockEl) { blockEl.classList.remove("opacity-40"); blockEl.draggable = false; }
    container.querySelectorAll(".block").forEach((b) => b.classList.remove("drop-before","drop-after"));
    draggedBlockId = null;
  });
  container.addEventListener("dragover", (e) => {
    if (!draggedBlockId) return;
    e.preventDefault();
    const blockEl = e.target.closest(".block");
    if (!blockEl || blockEl.dataset.blockId === draggedBlockId) return;
    const rect = blockEl.getBoundingClientRect();
    const before = (e.clientY - rect.top) < rect.height / 2;
    container.querySelectorAll(".block").forEach((b) => b.classList.remove("drop-before","drop-after"));
    blockEl.classList.add(before ? "drop-before" : "drop-after");
  });
  container.addEventListener("drop", (e) => {
    if (!draggedBlockId) return;
    e.preventDefault();
    const blockEl = e.target.closest(".block");
    if (!blockEl) return;
    const targetId = blockEl.dataset.blockId;
    const before = blockEl.classList.contains("drop-before");
    if (targetId !== draggedBlockId) reorderBlocks(day, draggedBlockId, targetId, before);
    draggedBlockId = null;
    renderDayBlocks(day);
  });
}
function reorderBlocks(day, draggedId, targetId, before) {
  const idx = day.blocks.findIndex((b) => b.id === draggedId);
  if (idx === -1) return;
  const [item] = day.blocks.splice(idx, 1);
  let targetIdx = day.blocks.findIndex((b) => b.id === targetId);
  if (targetIdx === -1) targetIdx = day.blocks.length;
  if (!before) targetIdx++;
  day.blocks.splice(targetIdx, 0, item);
}

function removeBlock(blockId) {
  for (const day of currentTrip.days) {
    const i = day.blocks.findIndex((b) => b.id === blockId);
    if (i !== -1) { day.blocks.splice(i, 1); renderDayBlocks(day); return; }
  }
}

/* ================================================================
   MENÚ SLASH ("/")
   ================================================================ */
const SLASH_OPTIONS = [
  { type: "accommodation", label: "Alojamiento", icon: ICONS.bed },
  { type: "flight", label: "Vuelo", icon: ICONS.plane },
  { type: "gpx", label: "Ruta (GPX)", icon: ICONS.route },
  { type: "planb", label: "Plan B", icon: ICONS.cloud },
  { type: "text", label: "Texto", icon: ICONS.text },
];
const BLOCK_MAKERS = { text: () => newTextBlock(), gpx: () => newGPXBlock(), accommodation: () => newAccommodationBlock(), flight: () => newFlightBlock(), planb: () => newPlanBBlock() };

let pendingSlashDay = null;
function initSlashMenu() {
  const menu = document.getElementById("slashMenu");
  menu.innerHTML = SLASH_OPTIONS.map((opt) =>
    `<button class="slash-opt w-full flex items-center gap-2.5 px-3 py-2 text-sm text-left hover:bg-black/5" data-type="${opt.type}">
      <span style="color:var(--moss);">${opt.icon}</span>${opt.label}
    </button>`
  ).join("");
  menu.querySelectorAll(".slash-opt").forEach((btn) => {
    btn.addEventListener("click", () => {
      if (!pendingSlashDay) return;
      pendingSlashDay.blocks.push(BLOCK_MAKERS[btn.dataset.type]());
      renderDayBlocks(pendingSlashDay);
      closeSlashMenu();
    });
  });
}
function openSlashMenu(day, anchorEl) {
  pendingSlashDay = day;
  const menu = document.getElementById("slashMenu");
  const rect = anchorEl.getBoundingClientRect();
  menu.style.left = Math.round(rect.left) + "px";
  menu.style.top = Math.round(rect.bottom + window.scrollY + 6) + "px";
  menu.classList.remove("is-hidden");
}
function closeSlashMenu() {
  document.getElementById("slashMenu").classList.add("is-hidden");
  pendingSlashDay = null;
}

function renderSlashTrigger(day) {
  const wrap = document.createElement("div");
  wrap.className = "pl-7 pr-7 mt-1";
  wrap.innerHTML = `<div class="slash-trigger rounded-lg px-3 py-2 text-sm cursor-text" contenteditable="true" data-placeholder="Escribe '/' para añadir un bloque" style="border:1px dashed var(--line); color:var(--muted);"></div>`;
  const trigger = wrap.querySelector(".slash-trigger");
  trigger.addEventListener("click", () => openSlashMenu(day, trigger));
  trigger.addEventListener("input", () => {
    if (trigger.textContent.includes("/")) { trigger.textContent = ""; openSlashMenu(day, trigger); }
  });
  return wrap;
}

/* ================================================================
   RENDER — DÍAS Y TIMELINE
   ================================================================ */
function renderDayBlocks(day) {
  const container = document.getElementById(`blocks-${day.id}`);
  container.innerHTML = "";
  day.blocks.forEach((block) => {
    try { container.appendChild(BLOCK_RENDERERS[block.type](block)); }
    catch (err) {
      const fallback = document.createElement("div");
      fallback.className = "mb-4 rounded-xl p-4 text-sm";
      fallback.style.cssText = "border:1px solid var(--line); color:var(--clay);";
      fallback.textContent = `No se ha podido mostrar este bloque (${err.message}).`;
      container.appendChild(fallback);
      console.warn("Error renderizando bloque", block.type, err);
    }
  });
}

function renderDay(day, index) {
  const wrap = document.createElement("div");
  wrap.className = "flex gap-4 mb-2";
  wrap.innerHTML = `
    <div class="flex flex-col items-center flex-shrink-0">
      <div class="day-dot w-8 h-8 rounded-full flex items-center justify-center text-sm flex-shrink-0">${index + 1}</div>
      <div class="day-rail flex-1 mt-1"></div>
    </div>
    <div class="flex-1 pb-10 min-w-0">
      <div class="flex items-baseline gap-2 mb-4">
        <p class="day-label single-line font-display text-lg" contenteditable="true" data-placeholder="Día"></p>
        <span class="day-date text-sm" contenteditable="true" data-placeholder="fecha" style="color:var(--muted);"></span>
      </div>
      <div id="blocks-${day.id}"></div>
      <div class="slash-slot"></div>
    </div>`;
  const labelEl = wrap.querySelector(".day-label");
  labelEl.textContent = day.label;
  labelEl.addEventListener("input", () => { day.label = labelEl.textContent; });
  // Si se deja vacío, vuelve al nombre por defecto en vez de quedarse sin título
  labelEl.addEventListener("blur", () => {
    if (!labelEl.textContent.trim()) { day.label = `Día ${index + 1}`; labelEl.textContent = day.label; }
  });
  const dateEl = wrap.querySelector(".day-date");
  dateEl.textContent = day.date;
  dateEl.addEventListener("input", () => day.date = dateEl.textContent);
  wrap.querySelector(".slash-slot").appendChild(renderSlashTrigger(day));
  attachDragEvents(wrap.querySelector(`#blocks-${day.id}`), day);
  return wrap;
}

function renderTimeline() {
  const el = document.getElementById("timeline");
  el.innerHTML = "";
  currentTrip.days.forEach((day, i) => {
    try { el.appendChild(renderDay(day, i)); renderDayBlocks(day); }
    catch (err) { console.warn("Error renderizando día", day.label, err); }
  });
}

/* ================================================================
   MODAL — Nuevo viaje
   ================================================================ */
let newTripTagsTemp = [];
function renderTagChips() {
  const box = document.getElementById("newTripTagChips");
  box.innerHTML = newTripTagsTemp.map((t, i) =>
    `<span class="inline-flex items-center gap-1 rounded-full px-2.5 py-1 text-xs" style="background:rgba(63,93,69,0.08); color:var(--moss-dark);">
      ${t}<button data-i="${i}" class="remove-tag-btn" style="color:var(--moss-dark);">${ICONS.close}</button>
    </span>`
  ).join("");
  box.querySelectorAll(".remove-tag-btn").forEach((btn) => btn.addEventListener("click", () => { newTripTagsTemp.splice(parseInt(btn.dataset.i), 1); renderTagChips(); }));
}
function openNewTripModal() {
  document.getElementById("newTripName").value = "";
  document.getElementById("newTripStart").value = "";
  document.getElementById("newTripEnd").value = "";
  document.getElementById("newTripTagInput").value = "";
  newTripTagsTemp = [];
  renderTagChips();
  document.getElementById("newTripModal").classList.remove("is-hidden");
  document.getElementById("newTripName").focus();
}
function closeNewTripModal() { document.getElementById("newTripModal").classList.add("is-hidden"); }

/* ================================================================
   INIT — listeners globales (se registran una sola vez)
   ================================================================ */
initSlashMenu();
renderDashboard();

document.getElementById("newTripBtn").addEventListener("click", openNewTripModal);
document.getElementById("cancelTripBtn").addEventListener("click", closeNewTripModal);
document.getElementById("newTripModalBackdrop").addEventListener("click", closeNewTripModal);
document.getElementById("backToDashboardBtn").addEventListener("click", backToDashboard);
document.getElementById("addDayBtn").addEventListener("click", () => {
  currentTrip.days.push(newDay(`Día ${currentTrip.days.length + 1}`, ""));
  renderTimeline();
});
document.getElementById("closePointsBtn").addEventListener("click", () => document.getElementById("pointsPanel").classList.add("is-hidden"));

const tagInput = document.getElementById("newTripTagInput");
tagInput.addEventListener("keydown", (e) => {
  if (e.key === "Enter" || e.key === ",") {
    e.preventDefault();
    const val = tagInput.value.trim().replace(/,$/, "");
    if (val) { newTripTagsTemp.push(val); tagInput.value = ""; renderTagChips(); }
  } else if (e.key === "Backspace" && tagInput.value === "" && newTripTagsTemp.length) {
    newTripTagsTemp.pop(); renderTagChips();
  }
});

document.getElementById("createTripBtn").addEventListener("click", () => {
  const name = document.getElementById("newTripName").value.trim();
  if (!name) { document.getElementById("newTripName").focus(); return; }
  const start = document.getElementById("newTripStart").value;
  const end = document.getElementById("newTripEnd").value;
  const trip = newTrip({ title: name, startDate: start, endDate: end, destinations: [...newTripTagsTemp] });
  trips.push(trip);
  closeNewTripModal();
  renderDashboard();
  openEditor(trip.id);
});

// Campos de una sola línea (nombre de ruta, estadísticas, nombre de día): Enter confirma
document.addEventListener("keydown", (e) => {
  if (e.key === "Enter" && e.target.closest && e.target.closest(".single-line")) {
    e.preventDefault();
    e.target.blur();
  }
});

// Único listener delegado para cerrar el menú slash al hacer clic fuera
document.addEventListener("click", (e) => {
  if (!e.target.closest("#slashMenu") && !e.target.closest(".slash-trigger")) closeSlashMenu();
});
</script>
</body>
</html>
