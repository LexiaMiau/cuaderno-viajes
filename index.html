<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cuaderno de viaje</title>

<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css" />
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/styles.css">
</head>
<body class="min-h-screen">

<!-- ================= DASHBOARD ================= -->
<div id="dashboardView">
  <div class="max-w-5xl mx-auto px-6 py-14">
    <div class="flex items-center justify-between gap-3 mb-10">
      <h1 class="font-display text-3xl">Mis viajes</h1>
      <div class="flex items-center gap-2">
        <button id="backupBtn" class="btn-ghost rounded-full px-4 py-2.5 text-sm font-medium" title="Exportar o importar tus viajes">Copia de seguridad</button>
        <button id="newTripBtn" class="btn-primary rounded-full px-5 py-2.5 text-sm font-medium">+ Nuevo viaje</button>
      </div>
    </div>

    <div id="emptyState" class="is-hidden rounded-2xl p-12 text-center" style="border:1px dashed var(--line);">
      <p class="font-display text-2xl mb-2">Aún no tienes viajes</p>
      <p class="text-sm mb-5" style="color:var(--muted);">Crea el primero y ve añadiendo días, reservas, rutas y presupuesto.</p>
      <button id="emptyNewBtn" class="btn-primary rounded-full px-5 py-2.5 text-sm font-medium">+ Nuevo viaje</button>
    </div>

    <section id="upcomingSection" class="mb-12">
      <h2 class="text-sm font-medium mb-4" style="color:var(--muted);">Próximos viajes</h2>
      <div id="upcomingGrid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6"></div>
    </section>
    <section id="pastSection">
      <h2 class="text-sm font-medium mb-4" style="color:var(--muted);">Viajes pasados</h2>
      <div id="pastGrid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6"></div>
    </section>
  </div>
  <input id="importInput" type="file" accept=".json,application/json" class="is-hidden" />
</div>

<!-- ================= VIAJE ================= -->
<div id="editorView" class="is-hidden">
  <div class="max-w-2xl mx-auto px-6 py-10">
    <button id="backToDashboardBtn" class="flex items-center gap-1.5 text-sm mb-8 icon-btn">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 18l-6-6 6-6"/></svg>
      Volver a mis viajes
    </button>

    <header class="mb-6">
      <div class="flex items-start justify-between gap-3 mb-3">
        <h1 id="editorTitle" contenteditable="true" data-placeholder="Título del viaje" class="single-line font-display text-4xl leading-tight flex-1 min-w-0"></h1>
        <button id="tripMenuBtn" class="icon-btn w-9 h-9 rounded-full flex items-center justify-center flex-shrink-0" style="border:1px solid var(--line);" title="Más opciones del viaje">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><circle cx="5" cy="12" r="1.8"/><circle cx="12" cy="12" r="1.8"/><circle cx="19" cy="12" r="1.8"/></svg>
        </button>
      </div>
      <div class="flex flex-wrap items-center gap-2 text-sm" style="color:var(--muted);">
        <div id="editorDates"></div>
        <div id="editorTags" class="flex flex-wrap items-center gap-1.5"></div>
      </div>
    </header>

    <nav id="tripTabs" class="tabs mb-8" aria-label="Secciones del viaje"></nav>
    <div id="tripContent"></div>
  </div>
</div>

<!-- ================= MODAL: nuevo viaje ================= -->
<div id="newTripModal" class="is-hidden fixed inset-0 z-[1000] flex items-center justify-center p-6">
  <div id="newTripModalBackdrop" class="absolute inset-0" style="background:rgba(0,0,0,.4);"></div>
  <div class="modal-card relative bg-white rounded-2xl max-w-md w-full p-6">
    <p class="font-display text-2xl mb-6">Nuevo viaje</p>
    <label class="block text-xs mb-1.5" style="color:var(--muted);">Nombre del viaje</label>
    <input id="newTripName" type="text" placeholder="Ej. Ruta por la Toscana" class="field mb-4" />
    <div class="grid grid-cols-2 gap-3 mb-4">
      <div><label class="block text-xs mb-1.5" style="color:var(--muted);">Fecha de inicio</label><input id="newTripStart" type="date" class="field" /></div>
      <div><label class="block text-xs mb-1.5" style="color:var(--muted);">Fecha de fin</label><input id="newTripEnd" type="date" class="field" /></div>
    </div>
    <label class="block text-xs mb-1.5" style="color:var(--muted);">Destinos principales</label>
    <input id="newTripTagInput" type="text" placeholder="Escribe un destino y pulsa Enter" class="field mb-2" />
    <div id="newTripTagChips" class="flex flex-wrap gap-1.5 mb-4 min-h-[1.5rem]"></div>
    <p id="newTripError" class="is-hidden text-sm mb-4" style="color:var(--clay);"></p>
    <p class="text-xs mb-5" style="color:var(--muted);">Con fechas, se crea un día por cada jornada del viaje.</p>
    <div class="flex justify-end gap-2">
      <button id="cancelTripBtn" class="btn-ghost rounded-full px-4 py-2 text-sm font-medium">Cancelar</button>
      <button id="createTripBtn" class="btn-primary rounded-full px-4 py-2 text-sm font-medium">Crear viaje</button>
    </div>
  </div>
</div>

<!-- Menú "/" (popover compartido) -->
<div id="slashMenu" class="is-hidden menu-pop fixed z-[900] py-1.5 w-56"></div>

<!-- Puntos de una ruta GPX -->
<div id="pointsPanel" class="is-hidden fixed inset-0 z-[1000] flex items-center justify-center p-6" style="background:rgba(0,0,0,.4);">
  <div class="bg-white rounded-2xl max-w-md w-full max-h-[70vh] flex flex-col overflow-hidden">
    <div class="p-4 flex items-center justify-between" style="border-bottom:1px solid var(--line);">
      <p class="font-display text-lg">Puntos de la ruta</p>
      <button id="closePointsBtn" class="w-7 h-7 rounded-full btn-ghost flex items-center justify-center text-sm">✕</button>
    </div>
    <div id="pointsList" class="overflow-y-auto p-4 text-xs font-mono space-y-1"></div>
  </div>
</div>

<!-- Estado de guardado -->
<div id="saveStatus" class="fixed bottom-4 right-5 text-xs pointer-events-none" style="color:var(--muted);">Guardado</div>

<script src="js/model.js"></script>
<script src="js/gpx.js"></script>
<script src="js/store.js"></script>
<script src="js/ui.js"></script>
<script src="js/blocks.js"></script>
<script src="js/sample.js"></script>
<script src="js/trip.js"></script>
<script src="js/dashboard.js"></script>
<script src="js/app.js"></script>
</body>
</html>
